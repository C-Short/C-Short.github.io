<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicago Transit & Grocery Access</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cta-mid:    #2e78c8;
    --cta-stroke: #88bbee;
    --groc-mid:   #2ea04a;
    --groc-stroke:#88ccaa;
    --ov-mid:     #d94010;

    --panel-bg:     rgba(10, 12, 16, 0.88);
    --panel-border: rgba(255,255,255,0.08);
    --text:         #e8eaf0;
    --text-muted:   #8892a0;

    --radius: 6px;
    --mono:   'JetBrains Mono', 'Fira Mono', 'Courier New', monospace;
    --sans:   'Inter', system-ui, sans-serif;
  }

  html, body { width:100%; height:100%; overflow:hidden; background:#0a0c10; }
  #map { position:absolute; inset:0; }

  /* ── Panel ── */
  #panel {
    position: absolute;
    top: 16px; left: 16px;
    width: 264px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-family: var(--sans);
    color: var(--text);
    overflow: hidden;
    z-index: 10;
    transition: width 0.22s ease;
  }

  #panel.collapsed { width: 44px; }

  #panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--panel-border);
    cursor: pointer;
    user-select: none;
    gap: 8px;
  }

  #panel-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-muted);
    white-space: nowrap;
    transition: opacity 0.15s;
  }

  #panel.collapsed #panel-title { opacity: 0; }

  #toggle-btn {
    flex-shrink: 0;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    transition: transform 0.22s;
  }

  #panel.collapsed #toggle-btn { transform: rotate(180deg); }

  #panel-body {
    padding: 16px 14px 14px;
    transition: opacity 0.15s;
  }

  #panel.collapsed #panel-body { opacity: 0; pointer-events: none; }

  /* ── Sections ── */
  .section { margin-bottom: 18px; }
  .section:last-child { margin-bottom: 0; }

  .section-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .layer-label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .swatch {
    width: 10px; height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* ── Slider ── */
  .slider-wrap {
    position: relative;
    padding-bottom: 18px;
  }

  .slider-track {
    position: relative;
    height: 3px;
    background: rgba(255,255,255,0.10);
    border-radius: 2px;
    margin: 0 1px;
    pointer-events: none;
  }

  .slider-fill {
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    border-radius: 2px;
    transition: width 0.08s;
    pointer-events: none;
  }

  /* tick marks at 0 / 33% / 66% / 100% */
  .slider-track::before,
  .slider-track::after,
  .slider-track .tick-mid1,
  .slider-track .tick-mid2 {
    content: '';
    position: absolute;
    top: 0; width: 1px; height: 100%;
    background: rgba(255,255,255,0.22);
  }
  .slider-track::before { left: 0; }
  .slider-track::after  { right: 0; }

  .tick-mid1 { left: 33.3%; }
  .tick-mid2 { left: 66.6%; }

  input[type=range] {
    position: absolute;
    top: -6px; left: 0;
    width: 100%;
    height: 16px;
    opacity: 0;
    cursor: pointer;
    margin: 0;
  }

  .slider-labels {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
  }

  .slider-labels span {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-muted);
    line-height: 1;
  }

  /* ── Toggle switch ── */
  .toggle {
    position: relative;
    width: 28px; height: 16px;
    flex-shrink: 0;
  }

  .toggle input { opacity:0; width:0; height:0; }

  .toggle-track {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.12);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.18s;
  }

  .toggle input:checked + .toggle-track { background: rgba(255,255,255,0.28); }

  .toggle-thumb {
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    background: var(--text-muted);
    border-radius: 50%;
    pointer-events: none;
    transition: transform 0.18s, background 0.18s;
  }

  .toggle input:checked ~ .toggle-thumb {
    transform: translateX(12px);
    background: #fff;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: var(--panel-border);
    margin: 14px 0;
  }

  /* ── Toggle rows (overlap / points) ── */
  .tog-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .tog-row:last-child { margin-bottom: 0; }

  .tog-label {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  /* ── Hover tooltip ── */
  #hover-tip {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 9px 14px;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--text);
    pointer-events: none;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    transition: opacity 0.12s;
    white-space: nowrap;
    z-index: 10;
    line-height: 1.9;
  }

  #hover-tip.visible { opacity: 1; }

  .tip-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tip-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <div id="panel-header">
    <span id="panel-title">Access Layers</span>
    <span id="toggle-btn">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M7.5 3.5L4.5 6.5L7.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </div>

  <div id="panel-body">

    <!-- CTA slider -->
    <div class="section">
      <div class="section-row">
        <div class="layer-label">
          <div class="swatch" style="background:var(--cta-mid)"></div>
          CTA L Walkshed
        </div>
        <label class="toggle">
          <input type="checkbox" id="tog-cta" checked>
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>
      <div class="slider-wrap">
        <div class="slider-track">
          <div class="tick-mid1"></div>
          <div class="tick-mid2"></div>
          <div class="slider-fill" id="fill-cta" style="background:var(--cta-mid);width:25%"></div>
        </div>
        <input type="range" id="slider-cta" min="0" max="3" step="1" value="0">
        <div class="slider-labels">
          <span>¼ mi</span><span>½</span><span>¾</span><span>1 mi</span>
        </div>
      </div>
    </div>

    <!-- Grocery slider -->
    <div class="section">
      <div class="section-row">
        <div class="layer-label">
          <div class="swatch" style="background:var(--groc-mid)"></div>
          Grocery Walkshed
        </div>
        <label class="toggle">
          <input type="checkbox" id="tog-groc" checked>
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>
      <div class="slider-wrap">
        <div class="slider-track">
          <div class="tick-mid1"></div>
          <div class="tick-mid2"></div>
          <div class="slider-fill" id="fill-groc" style="background:var(--groc-mid);width:25%"></div>
        </div>
        <input type="range" id="slider-groc" min="0" max="3" step="1" value="0">
        <div class="slider-labels">
          <span>¼ mi</span><span>½</span><span>¾</span><span>1 mi</span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Overlap toggle -->
    <div class="tog-row">
      <div class="tog-label">
        <div class="swatch" style="background:var(--ov-mid)"></div>
        Overlap
      </div>
      <label class="toggle">
        <input type="checkbox" id="tog-ov" checked>
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>

    <div class="divider"></div>

    <!-- Points toggles -->
    <div class="tog-row">
      <span class="tog-label">L Stations</span>
      <label class="toggle">
        <input type="checkbox" id="tog-cta-pts">
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
    <div class="tog-row">
      <span class="tog-label">Grocery Stores</span>
      <label class="toggle">
        <input type="checkbox" id="tog-groc-pts">
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>

  </div>
</div>

<div id="hover-tip"></div>

<script>
const DIST_LABELS = ['¼ mi', '½ mi', '¾ mi', '1 mi'];

const DATA_PATHS = {
  cta:    'data/walksheds_cta.geojson',
  groc:   'data/walksheds_groc.geojson',
  points: 'data/points.geojson',
};

const state = {
  ctaIdx:      0,
  grocIdx:     0,
  showCta:     true,
  showGroc:    true,
  showOv:      true,
  showCtaPts:  false,
  showGrocPts: false,
  ctaFeats:    [],
  grocFeats:   [],
};

// ── Map ───────────────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      basemap: {
        type: 'raster',
        tiles: [
          'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
          'https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
          'https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        ],
        tileSize: 256,
        maxzoom: 20,
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
      }
    },
    layers: [{ id: 'basemap', type: 'raster', source: 'basemap' }]
  },
  center: [-87.68, 41.84],
  zoom: 11,
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

// ── Load & init ───────────────────────────────────────────────
map.on('load', async () => {
  const [ctaGJ, grocGJ, ptsGJ] = await Promise.all([
    fetch(DATA_PATHS.cta).then(r => r.json()),
    fetch(DATA_PATHS.groc).then(r => r.json()),
    fetch(DATA_PATHS.points).then(r => r.json()),
  ]);

  state.ctaFeats  = ctaGJ.features.sort((a,b) => a.properties.dist_idx - b.properties.dist_idx);
  state.grocFeats = grocGJ.features.sort((a,b) => a.properties.dist_idx - b.properties.dist_idx);

  // Sources
  map.addSource('cta-ws',  { type: 'geojson', data: fc([state.ctaFeats[0]]) });
  map.addSource('groc-ws', { type: 'geojson', data: fc([state.grocFeats[0]]) });
  map.addSource('overlap', { type: 'geojson', data: fc([]) });
  map.addSource('points',  { type: 'geojson', data: ptsGJ });

  // Layers — fill then line for each, overlap on top, points last
  map.addLayer({ id:'cta-fill',  type:'fill',   source:'cta-ws',  paint:{ 'fill-color':'#2e78c8', 'fill-opacity':0.22 } });
  map.addLayer({ id:'cta-line',  type:'line',   source:'cta-ws',  paint:{ 'line-color':'#2e78c8', 'line-width':1.5, 'line-opacity':0.65 } });
  map.addLayer({ id:'groc-fill', type:'fill',   source:'groc-ws', paint:{ 'fill-color':'#2ea04a', 'fill-opacity':0.22 } });
  map.addLayer({ id:'groc-line', type:'line',   source:'groc-ws', paint:{ 'line-color':'#2ea04a', 'line-width':1.5, 'line-opacity':0.65 } });
  map.addLayer({ id:'ov-fill',   type:'fill',   source:'overlap', paint:{ 'fill-color':'#d94010', 'fill-opacity':0.42 } });
  map.addLayer({ id:'ov-line',   type:'line',   source:'overlap', paint:{ 'line-color':'#d94010', 'line-width':1,   'line-opacity':0.55 } });

  map.addLayer({
    id:'cta-pts', type:'circle', source:'points',
    filter: ['==', ['get','layer'], 'cta_station'],
    paint: { 'circle-radius':4, 'circle-color':'#1a4a7a', 'circle-stroke-color':'#88bbee', 'circle-stroke-width':1.5, 'circle-opacity':0.9 },
    layout: { visibility:'none' }
  });

  map.addLayer({
    id:'groc-pts', type:'circle', source:'points',
    filter: ['==', ['get','layer'], 'grocery_point'],
    paint: { 'circle-radius':3.5, 'circle-color':'#1a5c30', 'circle-stroke-color':'#88ccaa', 'circle-stroke-width':1.5, 'circle-opacity':0.9 },
    layout: { visibility:'none' }
  });

  recomputeOverlap();
  initHover();
});

// ── Helpers ───────────────────────────────────────────────────
function fc(features) {
  return { type:'FeatureCollection', features: features.filter(Boolean) };
}

function setVis(ids, visible) {
  ids.forEach(id => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none'));
}

function recomputeOverlap() {
  const shouldShow = state.showOv && state.showCta && state.showGroc;
  if (!shouldShow) { map.getSource('overlap').setData(fc([])); return; }

  const a = state.ctaFeats[state.ctaIdx];
  const b = state.grocFeats[state.grocIdx];
  if (!a || !b) return;

  try {
    const ov = turf.intersect(a, b);
    map.getSource('overlap').setData(ov ? fc([ov]) : fc([]));
  } catch(_) {
    map.getSource('overlap').setData(fc([]));
  }
}

function updateSliderFill(fillId, idx) {
  document.getElementById(fillId).style.width = `${(idx + 1) * 25}%`;
}

// ── Hover ─────────────────────────────────────────────────────
function initHover() {
  const tip = document.getElementById('hover-tip');

  map.on('mousemove', e => {
    const feats = map.queryRenderedFeatures(e.point, { layers: ['cta-fill','groc-fill','ov-fill'] });
    const hit = new Set(feats.map(f => f.layer.id));

    const inCta  = hit.has('cta-fill')  && state.showCta;
    const inGroc = hit.has('groc-fill') && state.showGroc;
    const inOv   = hit.has('ov-fill')   && state.showOv;

    if (!inCta && !inGroc && !inOv) {
      tip.classList.remove('visible');
      map.getCanvas().style.cursor = '';
      return;
    }

    map.getCanvas().style.cursor = 'crosshair';

    const rows = [];

    if (inOv) {
      rows.push(tipRow('#d94010', `Within ${DIST_LABELS[state.ctaIdx]} of L <em>and</em> ${DIST_LABELS[state.grocIdx]} of grocery`));
    } else {
      if (inCta)  rows.push(tipRow('#2e78c8', `Within ${DIST_LABELS[state.ctaIdx]} of an L station`));
      if (inGroc) rows.push(tipRow('#2ea04a', `Within ${DIST_LABELS[state.grocIdx]} of a grocery store`));
    }

    // If in overlap zone but overlap layer hidden, still describe the component layers
    if (!inOv && inCta && inGroc) {
      // already handled above
    }

    tip.innerHTML = rows.join('');
    tip.classList.add('visible');
  });

  map.on('mouseout', () => {
    tip.classList.remove('visible');
    map.getCanvas().style.cursor = '';
  });
}

function tipRow(color, text) {
  return `<div class="tip-row"><div class="tip-dot" style="background:${color}"></div>${text}</div>`;
}

// ── Sliders ───────────────────────────────────────────────────
document.getElementById('slider-cta').addEventListener('input', e => {
  state.ctaIdx = +e.target.value;
  updateSliderFill('fill-cta', state.ctaIdx);
  if (map.getSource('cta-ws')) {
    map.getSource('cta-ws').setData(fc([state.ctaFeats[state.ctaIdx]]));
    recomputeOverlap();
  }
});

document.getElementById('slider-groc').addEventListener('input', e => {
  state.grocIdx = +e.target.value;
  updateSliderFill('fill-groc', state.grocIdx);
  if (map.getSource('groc-ws')) {
    map.getSource('groc-ws').setData(fc([state.grocFeats[state.grocIdx]]));
    recomputeOverlap();
  }
});

// ── Toggles ───────────────────────────────────────────────────
document.getElementById('tog-cta').addEventListener('change', e => {
  state.showCta = e.target.checked;
  setVis(['cta-fill','cta-line'], state.showCta);
  recomputeOverlap();
});

document.getElementById('tog-groc').addEventListener('change', e => {
  state.showGroc = e.target.checked;
  setVis(['groc-fill','groc-line'], state.showGroc);
  recomputeOverlap();
});

document.getElementById('tog-ov').addEventListener('change', e => {
  state.showOv = e.target.checked;
  setVis(['ov-fill','ov-line'], state.showOv);
  recomputeOverlap();
});

document.getElementById('tog-cta-pts').addEventListener('change', e => {
  state.showCtaPts = e.target.checked;
  setVis(['cta-pts'], state.showCtaPts);
});

document.getElementById('tog-groc-pts').addEventListener('change', e => {
  state.showGrocPts = e.target.checked;
  setVis(['groc-pts'], state.showGrocPts);
});

// ── Panel collapse ────────────────────────────────────────────
document.getElementById('panel-header').addEventListener('click', () => {
  document.getElementById('panel').classList.toggle('collapsed');
});
</script>
</body>
</html>
